name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy secgraph
      - name: Generated documentation is current
        run: |
          secgraph ontology docs > docs/ONTOLOGY.md
          python scripts/export_openapi.py docs/openapi.json
          git diff --exit-code -- docs/ONTOLOGY.md docs/openapi.json

  test-sqlite:
    name: Tests (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: python -m pytest -m "not ui" --cov --cov-report=term-missing:skip-covered --cov-fail-under=85

  test-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secgraph
          POSTGRES_PASSWORD: secgraph
          POSTGRES_DB: secgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secgraph -d secgraph_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SECGRAPH_TEST_DATABASE_URL: postgresql+psycopg://secgraph:secgraph@127.0.0.1:5432/secgraph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: python -m pytest -m "not ui"

  test-console:
    name: Console in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: playwright install --with-deps chromium
      - run: python -m pytest -m ui

  image:
    name: Build the image and start the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start with the quickstart script
        run: bash scripts/quickstart.sh --demo
      - name: The installation is healthy and the demo is loaded
        run: |
          docker compose exec -T api secgraph doctor
          curl --fail --silent http://127.0.0.1:8080/ready
          docker compose exec -T api secgraph report overview > overview.json
          python3 -c 'import json; d = json.load(open("overview.json")); assert (d["entry_points"], d["targets"], d["targets_at_risk"]) == (4, 15, 11), d'
      - name: It runs as a non-root user on a read-only filesystem
        run: |
          test "$(docker compose exec -T api id -u)" = "10001"
          ! docker compose exec -T api sh -c 'touch /opt/secgraph/probe' 2>/dev/null
      - name: Running the script again changes nothing
        run: bash scripts/quickstart.sh | grep -q "Users already exist"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
