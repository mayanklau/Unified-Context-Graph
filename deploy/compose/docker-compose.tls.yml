# TLS in front of the API, for a single-host installation.
#
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.tls.yml up -d
#
# Put the certificate and key issued by your internal CA in deploy/nginx/certs/
# as tls.crt and tls.key. The API is no longer published directly; only nginx is.

services:
  api:
    command: ["serve", "--forwarded-allow-ips", "*"]
    ports: !reset []

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SECGRAPH_TLS_BIND:-0.0.0.0}:${SECGRAPH_TLS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx/secgraph.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
