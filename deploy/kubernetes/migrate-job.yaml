# Applies database migrations. Jobs are immutable, so the name carries the version:
# a new release is a new Job. The API pods wait for the schema before they start.
apiVersion: batch/v1
kind: Job
metadata:
  name: secgraph-migrate-1-0-0
  labels:
    app.kubernetes.io/name: security-graph
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-graph
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: security-graph:1.0.0
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: secgraph-config
            - secretRef:
                name: secgraph-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
