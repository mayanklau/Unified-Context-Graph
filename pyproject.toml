[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-graph"
version = "1.0.0"
description = "Sovereign, on-prem security graph: one ontology-driven graph of assets, identities, exposure, detections and AI agents, with explainable attack-path maths and a governed interface for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "EY Cyber AI Centre of Excellence" }]
keywords = ["security", "knowledge-graph", "attack-path", "exposure-management", "mcp", "on-prem"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
    "numpy>=2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "mcp>=1.9",
]
ui-test = ["playwright>=1.44"]

[project.scripts]
secgraph = "secgraph.cli:main"

[tool.setuptools.packages.find]
include = ["secgraph*"]

[tool.setuptools.package-data]
secgraph = [
    "ontology/*.yaml",
    "ingest/mappings/*.yaml",
    "static/*",
    "store/migrations/*.py",
    "store/migrations/*.mako",
    "store/migrations/versions/*.py",
    "demo/*.json",
    "demo/sources/*",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: needs SECGRAPH_TEST_DATABASE_URL pointing at a PostgreSQL database",
    "ui: needs a Chromium browser (playwright)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["secgraph"]
omit = ["secgraph/store/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "S101",  # assert is fine in tests and for internal invariants
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "S607", "S108"]
"scripts/*" = ["S311", "S603", "S607"]
"secgraph/demo/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["secgraph/store/migrations/"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
